name: Backend Tests 

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:    
      POSTGRES_USER: qa_sandbox_user
      POSTGRES_PASSWORD: qa_sandbox_pass
      POSTGRES_DB: qa_sandbox_test_db
      DB_HOST: localhost
      DB_PORT: 5432
      DB_BASE: postgresql+asyncpg://qa_sandbox_user:qa_sandbox_pass@localhost:5432
      DATABASE_URL: postgresql+asyncpg://qa_sandbox_user:qa_sandbox_pass@localhost:5432/qa_sandbox_test_db
      TEST_DATABASE_URL: postgresql+asyncpg://qa_sandbox_user:qa_sandbox_pass@localhost:5432/qa_sandbox_test_db
    
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: qa_sandbox_user
          POSTGRES_PASSWORD: qa_sandbox_pass
          POSTGRES_DB: qa_sandbox_test_db
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "app/backend/.python-version"
          
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: |
          cd app/backend
          uv sync

      - name: Run migrations
        run: | 
          cd app/backend
          uv run alembic upgrade head

      - name: Run tests
        run: |
          cd app/backend
          uv run pytest -v

      - name: Load Allure test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Generate Allure test report
        uses: andgineer/allure-report@v3.5
        id: allure-report
        if: always()
        with:
          allure-results: app/backend/allure-results
          website: gh-pages-dir
          reports-site-path: builds/backend-tests
          report-page: behaviors

      - name: Publish Allure test report
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ always() && (steps.allure-report.outcome == 'success') }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ steps.allure-report.outputs.reports-site }}
          destination_dir: ${{ steps.allure-report.outputs.reports-site-path }}
