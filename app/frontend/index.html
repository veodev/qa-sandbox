<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <link href="./style.css"/ rel="stylesheet">
        <title>QA Sandbox Frontend</title>
    </head>
    <body>
        <h1>Регистрация нового пользователя</h1>
        <div class="form-group">
            <label>Имя:</label>
            <input type="text" id="name" placeholder="Ivan">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" placeholder="ivan@example.com">
        </div>
        <div class="form-group">
            <label>Пароль:</label>
            <input type="password" id="password" placeholder="strongpassword">
        </div>
        <button id="create-btn">Создать пользователя</button>

        <script src="./script.js"></script>
    </body>
</html>
