[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pwdlib>=0.3.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "alembic/versions",
]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (ошибки стиля)
    "F",   # Pyflakes (неиспользуемые импорты, неопределенные имена)
    "I",   # isort (сортировка импортов)
    "B",   # flake8-bugbear (поиск потенциальных багов)
    "UP",  # pyupgrade (современный синтаксис Python)
]

ignore = [
    "E501",
    "B008"
]


[tool.ruff.lint.isort]
known-first-party = ["app", "backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"models/*.py" = ["UP037"]

