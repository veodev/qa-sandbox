services:
  database:
    image: postgres:18-alpine
    container_name: qa-sandbox-postgres
    environment:
      POSTGRES_USER: qa_sandbox_user
      POSTGRES_PASSWORD: qa_sandbox_pass
      POSTGRES_DB: qa_sandbox_db
      DATABASE_URL: postgresql+asyncpg://qa_sandbox_user:qa_sandbox_pass@database:5432/qa_sandbox_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
  backend:
    build: ./app/backend
    container_name: qa-sandbox-backend
    env_file:
      - ./app/backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: qa-sandbox-frontend
    ports:
      - "80:80"
    volumes:
      - ./app/frontend:/usr/share/nginx/html:ro
      - ./app/frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data: